# SIMH config for QEMU guest - mirrors simh.cfg with /unix paths.
# NOTE: do NOT ship a pre-created /unix/tape file; let SIMH create it
# (an existing 0-byte tape hangs the attach). dci telnet lines are kept
# but harmless if the guest has no network.
set cpu 11/20
set cpu 32K
set rk0 enabled
att rk0 /unix/rk0.dsk
set rf 2p
set rf enabled
att rf /unix/rf0.dsk
set tc enabled
att tc /unix/tape
set hk disabled
set tm disabled
set rx disabled
set rl disabled
set tq disabled
set tc enabled
set rf enabled
set ke enabled
set cpu history=1000
set dci en
set dci lines=8
set dco 7b
att dci 5555
load /unix/m792low.load
dep system sr 173700
go 73700
